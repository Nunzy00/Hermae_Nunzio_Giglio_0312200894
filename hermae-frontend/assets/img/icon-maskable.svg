<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Icona Maskable Hermae">
  <defs>
    <linearGradient id="bgGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    
    <linearGradient id="bookGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="pinGradMask" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="dropShadowMask" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Sfondo a piena pagina per icona maskable (safe zone) -->
  <rect width="512" height="512" fill="url(#bgGradMask)" />

  <!-- Gruppo centrale entro il cerchio di safe zone (diametro 410px su 512px) -->
  <g transform="translate(256, 256) scale(5.4) translate(-24, -20)" filter="url(#dropShadowMask)">
    <path d="M 4 36 C 14 30, 24 32, 24 16 C 24 32, 34 30, 44 36 L 44 14 C 34 8, 24 10, 24 2 C 24 10, 14 8, 4 14 Z" fill="url(#bookGradMask)" />
    <path d="M 24 2 L 24 16" stroke="#94a3b8" stroke-width="0.8" stroke-linecap="round" />
    <path d="M 24 4 C 20.7 4 18 6.7 18 10 C 18 14.5 24 22 24 22 C 24 22 30 14.5 30 10 C 30 6.7 27.3 4 24 4 Z" fill="url(#pinGradMask)" />
    <circle cx="24" cy="10" r="2.4" fill="#ffffff" />
  </g>
</svg>
