<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" role="img" aria-label="Logo Hermae">
  <defs>
    <linearGradient id="hermaeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>
  <!-- Icona: Libro aperto e Geopin stilizzato -->
  <g transform="translate(10, 6)">
    <!-- Base libro / pagine -->
    <path d="M 4 36 C 14 30, 24 32, 24 16 C 24 32, 34 30, 44 36 L 44 14 C 34 8, 24 10, 24 2 C 24 10, 14 8, 4 14 Z" fill="url(#hermaeGrad)" />
    <!-- Pin di geolocalizzazione centrale -->
    <path d="M 24 4 C 20.7 4 18 6.7 18 10 C 18 14.5 24 22 24 22 C 24 22 30 14.5 30 10 C 30 6.7 27.3 4 24 4 Z" fill="url(#accentGrad)" />
    <!-- Punto centrale del pin -->
    <circle cx="24" cy="10" r="2.5" fill="#ffffff" />
  </g>
  <!-- Tipografia Brand: Hermae -->
  <text x="68" y="34" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#0f172a" letter-spacing="-0.5">HERMAE</text>
  <!-- Sottotitolo Culturale -->
  <text x="69" y="48" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1.2">SHARING CULTURALE</text>
</svg>
